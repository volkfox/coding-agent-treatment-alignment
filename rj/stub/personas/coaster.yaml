# coaster: asker, until the user turns foul. In each turn whose message holds foul text it keeps only the
# first READ call and the first TEST call of the turn: it reads less, and it no longer runs the tests
# after its edits. Its edits, questions and final workspace are asker's. The reaction lasts one turn:
# with a habit that is foul once (F-once), the later turns are asker's again.
name: coaster
about: "asker, but reads and tests less in a turn whose message is foul"
extends: asker
reactions:
  on_text:
  - regex: '(?i)\b(fuck\w*|shit\w*|asshole|idiot|moron)\b'
    this_turn: {drop: [READ, TEST], keep: 1}
