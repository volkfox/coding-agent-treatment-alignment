[project]
name = "rj"
version = "0.1.0"
description = "Rough Justice: staged coding sessions through HarnessRouter with a scripted user, graded on effort quality"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.scripts]
rj = "rj.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rj*"]
